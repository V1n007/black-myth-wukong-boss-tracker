<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wukong Boss Checklist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
--font-main: 'Noto Serif SC', serif;
--color-gold: #d4af37;
--color-dark-bg: #121212;
--color-content-bg: #1e1e1e;
--color-content-bg-hover: #2a2a2a;
--color-text: #e0e0e0;
--color-text-subtle: #aaa;
--color-text-disabled: #666;
--color-red-accent: #8c1c1c;
--color-warning: #ffc107;
--color-warning-red: #ff3b3b;
}
body {
font-family: var(--font-main);
background-color: var(--color-dark-bg);
background-image: radial-gradient(circle at top center, rgba(255,255,255,0.05) 0%,rgba(0,0,0,0.5) 80%);
color: var(--color-text);
margin: 0;
padding: 2rem;
min-height: 100vh;
}
h1 {
text-align: center;
color: var(--color-gold);
font-weight: 700;
letter-spacing: 2px;
margin-bottom: 2rem;
}
#app-container {
max-width: 900px;
margin: 0 auto;
background-color: var(--color-content-bg);
border-radius: 10px;
overflow: hidden;
border: 1px solid #333;
}
.tab-container {
display: flex;
background-color: #1a1a1a;
border-bottom: 2px solid var(--color-gold);
}
.tab-button {
padding: 15px 20px;
cursor: pointer;
background-color: transparent;
border: none;
color: var(--color-text-subtle);
font-family: var(--font-main);
font-size: 1rem;
transition: background-color 0.2s, color 0.2s;
}
.tab-button:hover {
background-color: var(--color-content-bg-hover);
color: var(--color-text);
}
.tab-button.active {
  color: var(--color-gold);
  font-weight: 700;
  border-bottom: 2px solid transparent;
  background-color: var(--color-content-bg);
  }

  .chapter-progress-badge {
  display: inline-block;
  margin-left: 8px;
  font-size: 0.85rem;
  color: var(--color-text-subtle);
  font-weight: 400;
  }

  .tab-button.active .chapter-progress-badge {
  color: var(--color-gold);
  }

  .chapter-progress-badge.complete {
  color: #4caf50;
  font-weight: 700;
  }
.tab-content {
display: none;
padding: 20px;
}
.tab-content.active {
display: block;
}
.boss-list {
list-style: none;
padding: 0;
}
.boss-item {
display: flex;
align-items: center;
background-color: #2c2c2c;
border-radius: 8px;
margin-bottom: 10px;
padding: 15px 20px;
cursor: pointer;
transition: background-color 0.2s, color 0.2s, border-color 0.2s;
border-left: 5px solid #444;
}
.boss-item:hover {
background-color: var(--color-content-bg-hover);
border-left-color: var(--color-red-accent);
}
.boss-item.completed {
      background-color: #3d3d3d;
      border-left-color: var(--color-gold);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.15);
      animation: subtleGlow 4s ease-in-out infinite;
  }

  .boss-item.completed::before {
      animation: checkmarkGlow 4s ease-in-out infinite;
  }


  .boss-item.completed::before {
      animation: checkmarkGlow 3s ease-in-out infinite;
  }
.boss-item::before {
content: '☐';
color: var(--color-text-disabled);
font-size: 1.5rem;
margin-right: 15px;
line-height: 1;
font-family: sans-serif;
}
.boss-item.completed::before {
content: '✔';
color: var(--color-gold);
}
@keyframes subtleGlow {
      0%, 100% {
          box-shadow: 0 0 8px rgba(212, 175, 55, 0.12);
      }
      50% {
          box-shadow: 0 0 12px rgba(212, 175, 55, 0.2);
      }
  }

  @keyframes checkmarkGlow {
      0%, 100% {
          text-shadow: 0 0 3px rgba(212, 175, 55, 0.5);
      }
      50% {
          text-shadow: 0 0 6px rgba(212, 175, 55, 0.7);
      }
  }
.boss-info {
display: flex;
flex-direction: column;
}
.boss-name {
font-size: 1.1rem;
font-weight: bold;
color: var(--color-text);
text-decoration: none !important;
}
.boss-item.completed .boss-name {
color: var(--color-text-disabled);
text-decoration: line-through !important;
}
.boss-details {
font-size: 0.85rem;
color: var(--color-text-subtle);
}
.boss-warning {
 font-size: 0.8rem;
color: #ffc107;
font-weight: bold;
margin-top: 4px;
}
.warning-red-text {
color: var(--color-warning-red);
}
.boss-item.completed .boss-details {
color: var(--color-text-disabled);
}
.boss-thumbnail {
    width: 50px;
    height: 50px;
    border-radius: 5px;
    margin-right: 15px;
    object-fit: cover;
    cursor: pointer;
    transition: transform 0.2s ease-in-out;
    flex-shrink: 0;
  }
  .boss-thumbnail:hover {
    transform: scale(1.1);
  }
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .modal.visible {
       display: flex;
       opacity: 1;
  }
  .modal-content {
    display: block;
    max-width: 80vw;
    max-height: 80vh;
    animation: zoom 0.3s ease;
  }
  @keyframes zoom {
    from {transform: scale(0.5);}
    to {transform: scale(1);}
  }
  .modal-close {
    position: absolute;
    top: 20px;
    right: 35px;
    color: #f1f1f1;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    transition: color 0.2s;
  }
  .modal-close:hover {
       color: #bbb;
  }
  #progress-container {
    max-width: 900px;
    margin: 0 auto 2rem auto;
    background-color: #2c2c2c;
    border-radius: 5px;
    padding: 5px;
    position: relative;
    border: 1px solid #333;
}

#progress-bar {
    width: 0%;
    height: 20px;
    background-color: var(--color-gold);
    border-radius: 3px;
    transition: width 0.5s ease-in-out;
}

#progress-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
    font-size: 0.9rem;
}
.search-container {
    padding: 15px 20px;
    background-color: var(--color-content-bg);
    border-bottom: 1px solid #333;
}
#boss-search {
    width: 100%;
    padding: 10px;
    border: 1px solid #444;
    border-radius: 5px;
    background-color: #2c2c2c;
    color: var(--color-text);
    font-family: var(--font-main);
    font-size: 0.95rem;
    box-sizing: border-box;
}
#boss-search::placeholder {
    color: var(--color-text-subtle);
}
#boss-search:focus {
      outline: none;
      border-color: var(--color-gold);
  }

  .check-all-container {
      padding: 15px 20px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: flex-end;
  }

  .check-all-btn {
      background-color: var(--color-gold);
      color: #1e1e1e;
      border: none;
      padding: 8px 20px;
      border-radius: 5px;
      font-family: var(--font-main);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
  }

  .check-all-btn:hover {
      background-color: #e6c350;
      transform: translateY(-2px);
  }

  .check-all-btn:active {
      transform: translateY(0);
  }

  .filter-warning-btn {
      background-color: var(--color-warning);
      color: #1e1e1e;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-family: var(--font-main);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
      margin-left: 10px;
  }

  .filter-warning-btn:hover {
      background-color: #ffcd38;
      transform: translateY(-2px);
  }

  .filter-warning-btn:active {
      transform: translateY(0);
  }

  .filter-warning-btn.active {
      background-color: var(--color-warning-red);
      color: white;
  }
  .reset-button {
      background-color: #f44336;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-family: var(--font-main);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
      margin-left: 10px;
  }

  .reset-button:hover {
      background-color: #d32f2f;
      transform: translateY(-2px);
  }

  .reset-button:active {
      transform: translateY(0);
  }

  .reset-modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
  }

  .reset-modal.visible {
      display: flex;
      opacity: 1;
  }

  .reset-modal-content {
      background-color: var(--color-content-bg);
      padding: 2rem;
      border-radius: 10px;
      border: 2px solid #f44336;
      max-width: 400px;
      text-align: center;
  }

  .reset-modal-content h3 {
      color: #f44336;
      margin-top: 0;
      font-size: 1.5rem;
  }

  .reset-modal-content p {
      color: var(--color-text);
      margin: 1rem 0 2rem 0;
      line-height: 1.5;
  }

  .reset-modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
  }

  .reset-confirm-btn,
  .reset-cancel-btn {
      padding: 10px 30px;
      border: none;
      border-radius: 5px;
      font-family: var(--font-main);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
  }

  .reset-confirm-btn {
      background-color: #f44336;
      color: white;
  }

  .reset-confirm-btn:hover {
      background-color: #d32f2f;
  }

  .reset-cancel-btn {
      background-color: var(--color-gold);
      color: #1e1e1e;
  }

  .reset-cancel-btn:hover {
      background-color: #e6c350;
  }
  .notes-icon {
      display: inline-block;
      margin-left: 10px;
      font-size: 0.9rem;
      color: var(--color-text-subtle);
      cursor: pointer;
      transition: color 0.2s, transform 0.2s;
      user-select: none;
  }

  .notes-icon:hover {
      color: var(--color-gold);
      transform: scale(1.1);
  }

  .notes-icon.has-note {
      color: var(--color-gold);
  }

  .boss-note-display {
      display: none;
      background-color: #2a2a2a;
      border-left: 3px solid var(--color-gold);
      border-radius: 5px;
      padding: 10px 12px;
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--color-text);
      line-height: 1.5;
      font-style: italic;
  }

  .boss-note-display.visible {
      display: block;
  }

  .boss-note-display::before {
      content: '📝 Note: ';
      color: var(--color-gold);
      font-weight: bold;
      font-style: normal;
  }

  .notes-modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
  }

  .notes-modal.visible {
      display: flex;
      opacity: 1;
  }

  .notes-modal-content {
      background-color: var(--color-content-bg);
      padding: 2rem;
      border-radius: 10px;
      border: 2px solid var(--color-gold);
      max-width: 500px;
      width: 90%;
  }

  .notes-modal-content h3 {
      color: var(--color-gold);
      margin-top: 0;
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
  }

  .notes-modal-content .boss-name-label {
      color: var(--color-text-subtle);
      font-size: 0.9rem;
      margin-bottom: 1rem;
  }

  .notes-textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 5px;
      background-color: #2c2c2c;
      color: var(--color-text);
      font-family: var(--font-main);
      font-size: 0.95rem;
      resize: vertical;
      box-sizing: border-box;
  }

  .notes-textarea:focus {
      outline: none;
      border-color: var(--color-gold);
  }

  .notes-textarea::placeholder {
      color: var(--color-text-disabled);
  }

  .notes-modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 1.5rem;
      justify-content: flex-end;
  }

  .notes-save-btn,
  .notes-delete-btn,
  .notes-cancel-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-family: var(--font-main);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
  }

  .notes-save-btn {
      background-color: var(--color-gold);
      color: #1e1e1e;
  }

  .notes-save-btn:hover {
      background-color: #e6c350;
  }

  .notes-delete-btn {
      background-color: #f44336;
      color: white;
  }

  .notes-delete-btn:hover {
      background-color: #d32f2f;
  }

  .notes-cancel-btn {
      background-color: #555;
      color: var(--color-text);
  }

  .notes-cancel-btn:hover {
      background-color: #666;
  }

  /* Support Footer */
  .support-footer {
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.3) 100%);
      border-top: 1px solid #333;
      padding: 1.5rem 2rem;
      text-align: center;
      margin-top: 3rem;
  }

  .footer-content {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
  }

  .footer-text {
      color: var(--color-text-subtle);
      font-size: 0.9rem;
  }

  .footer-text .heart {
      color: #ff4757;
      animation: heartbeat 1.5s ease-in-out infinite;
  }

  .support-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--color-gold);
      color: #1e1e1e;
      padding: 10px 24px;
      border-radius: 25px;
      text-decoration: none;
      font-family: var(--font-main);
      font-size: 0.95rem;
      font-weight: 700;
      transition: all 0.3s;
      border: 2px solid var(--color-gold);
  }

  .support-button:hover {
      background-color: transparent;
      color: var(--color-gold);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
  }

  @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      10%, 30% { transform: scale(1.1); }
      20%, 40% { transform: scale(1); }
  }

  /* Mobile Responsive */
  @media (max-width: 768px) {
      body { padding: 1rem 0.5rem; }
      h1 { font-size: 1.5rem; margin-bottom: 1rem; }
      .search-container { flex-direction: column !important; gap: 8px !important; }
      #boss-search { width: 100% !important; }
      .filter-warning-btn, .reset-button { width: 100%; margin-left: 0 !important; }
      .tab-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .tab-button { padding: 12px 15px; font-size: 0.9rem; white-space: nowrap; }
      .boss-item { padding: 12px 15px; }
      .boss-thumbnail { width: 40px; height: 40px; margin-right: 10px; }
      .boss-name { font-size: 1rem; }
      .boss-details { font-size: 0.8rem; }
      .modal-content, .reset-modal-content, .notes-modal-content { max-width: 90vw; padding: 1.5rem; }
      .support-footer { padding: 1rem; }
      .footer-text { font-size: 0.85rem; }
  }
  @media (max-width: 480px) {
      h1 { font-size: 1.3rem; }
      .tab-button { padding: 10px 12px; font-size: 0.85rem; }
      .boss-name { font-size: 0.95rem; }
  }
  </style>
</head>

      document.addEventListener('DOMContentLoaded', () => {

           const savedState = JSON.parse(localStorage.getItem(storageKey) || '{}');
           const notesStorageKey = 'wukongBossNotes';
             const savedNotes = JSON.parse(localStorage.getItem(notesStorageKey) || '{}');

           function updateProgress() {
                 const totalBosses = bosses.length;
                 const completedCount = Object.values(savedState).filter(isComplete => isComplete).length;
                 const percentage = totalBosses > 0 ? (completedCount / totalBosses) * 100 : 0;

                 const progressBar = document.getElementById('progress-bar');
                 const progressText = document.getElementById('progress-text');

                 if (progressBar) {
                     progressBar.style.width = percentage + '%';
                 }
                 if (progressText) {
                     progressText.textContent = `${completedCount} / ${totalBosses}`;
                 }

                 updateChapterProgress();
             }

             function updateChapterProgress() {
                 document.querySelectorAll('.chapter-progress-badge').forEach(badge => {
                     const chapter = badge.dataset.chapter;
                     const chapterBosses = bosses.filter(b => b.chapter === chapter);
                     const completed = chapterBosses.filter(b => savedState[b.id]).length;
                     const total = chapterBosses.length;

                     badge.textContent = `(${completed}/${total})`;

                     if (completed === total) {
                         badge.classList.add('complete');
                     } else {
                         badge.classList.remove('complete');
                     }
                 });
             }
             let showWarningOnly = false;

             function applySearchFilter() {
                 const searchTerm = bossSearchInput.value.toLowerCase();
                 document.querySelectorAll('.boss-item').forEach(li => {
                     const bossName = li.querySelector('.boss-name').textContent.toLowerCase();
                     const hasWarning = li.querySelector('.boss-warning') !== null;

                     const matchesSearch = bossName.includes(searchTerm);
                     const matchesWarningFilter = !showWarningOnly || hasWarning;

                     li.style.display = (matchesSearch && matchesWarningFilter) ? 'flex' : 'none';
                 });
             }

             updateProgress();
         const bossesByChapter = bosses.reduce((acc, boss) => {
             const chapter = boss.chapter;
             if (!acc[chapter]) acc[chapter] = [];
             acc[chapter].push(boss);
             return acc;
         }, {});

         const chapterOrder = ["Chapter 1", "Chapter 2", "Chapter 3", "Chapter 4", "Chapter 5", "Chapter 6"];
           chapterOrder.forEach((chapter, index) => {
               if (!bossesByChapter[chapter]) return;

               const tabButton = document.createElement('button');
                 tabButton.className = 'tab-button';
                 tabButton.dataset.tab = `tab-${index}`;

                 const chapterText = document.createTextNode(chapter);
                 tabButton.appendChild(chapterText);

                 const progressBadge = document.createElement('span');
                 progressBadge.className = 'chapter-progress-badge';
                 progressBadge.dataset.chapter = chapter;
                 tabButton.appendChild(progressBadge);

                 tabButtonContainer.appendChild(tabButton);

               const tabContent = document.createElement('div');
               tabContent.className = 'tab-content';
               tabContent.id = `tab-${index}`;

               const checkAllContainer = document.createElement('div');
               checkAllContainer.className = 'check-all-container';

               const checkAllBtn = document.createElement('button');
                 checkAllBtn.className = 'check-all-btn';
                 checkAllBtn.textContent = `Mark All ${chapter} Complete`;

                 const updateButtonText = () => {
                     const bossItems = tabContent.querySelectorAll('.boss-item');
                     const allCompleted = Array.from(bossItems).every(item => item.classList.contains('completed'));
                     checkAllBtn.textContent = allCompleted ? `Unmark All ${chapter}` : `Mark All ${chapter} Complete`;
                 };

                 checkAllBtn.addEventListener('click', () => {
                     const bossItems = tabContent.querySelectorAll('.boss-item');
                     const allCompleted = Array.from(bossItems).every(item => item.classList.contains('completed'));

                     bossItems.forEach(item => {
                         if (allCompleted) {
                             item.classList.remove('completed');
                             savedState[item.dataset.id] = false;
                         } else {
                             item.classList.add('completed');
                             savedState[item.dataset.id] = true;
                         }
                     });

                     localStorage.setItem(storageKey, JSON.stringify(savedState));
                     updateProgress();
                     updateButtonText();
                 });

               checkAllContainer.appendChild(checkAllBtn);
               tabContent.appendChild(checkAllContainer);

               const bossList = document.createElement('ul');
               bossList.className = 'boss-list';

             bossesByChapter[chapter].forEach(boss => {
                 const li = document.createElement('li');
                 li.className = 'boss-item';
                 li.dataset.id = boss.id;

                 if (savedState[boss.id]) {
                     li.classList.add('completed');
                 }

                 const imageName = imageNameMap[boss.id];

                 let innerHTML = `
                        <img src="images/${imageName}" class="boss-thumbnail" alt="${boss.name}" onerror="this.style.display='none'">

                   li.innerHTML = innerHTML;

                 const thumbnail = li.querySelector('.boss-thumbnail');
                   if (thumbnail) {
                        thumbnail.addEventListener('click', (event) => {
                            event.stopPropagation();
                            modalImg.src = thumbnail.src;
                            modal.classList.add('visible');
                        });
                   }

                   const noteDisplay = li.querySelector('.boss-note-display');
                   const notesIcon = li.querySelector('.notes-icon');
                   if (savedNotes[boss.id]) {

                   if (notesIcon) {
                       notesIcon.addEventListener('click', (event) => {
                           event.stopPropagation();
                           openNotesModal(boss.id, boss.name);
                       });

                   li.addEventListener('click', (e) => {
                    if (e.target.tagName === 'IMG') return;
                 li.classList.toggle('completed');
                 savedState[li.dataset.id] = li.classList.contains('completed');
                 localStorage.setItem(storageKey, JSON.stringify(savedState));
                 updateProgress();
                 });

                 bossList.appendChild(li);

             });

                         if (notesIcon) {
                             notesIcon.classList.add('has-note');
                         }
                     }
                     closeNotesModal();
                 });
             }

             if (notesDeleteBtn) {
                 notesDeleteBtn.addEventListener('click', () => {
                     if (currentNoteBossId && savedNotes[currentNoteBossId]) {
                         delete savedNotes[currentNoteBossId];
                         localStorage.setItem(notesStorageKey, JSON.stringify(savedNotes));

                         const noteDisplay = document.querySelector(`.boss-note-display[data-note-id="${currentNoteBossId}"]`);
                         const notesIcon = document.querySelector(`.notes-icon[data-boss-id="${currentNoteBossId}"]`);
                         if (noteDisplay) {
                             noteDisplay.classList.remove('visible');
                             noteDisplay.textContent = '';
                         }
                         if (notesIcon) {
                             notesIcon.classList.remove('has-note');
                         }
                     }
                     closeNotesModal();
                 });
             }

             if (notesCancelBtn) {
                 notesCancelBtn.addEventListener('click', closeNotesModal);
             }

             if (notesModal) {
                 notesModal.addEventListener('click', (e) => {
                     if (e.target === notesModal) {
                         closeNotesModal();
                     }
                 });
             }
         });
  </script>
</body>
</html>
